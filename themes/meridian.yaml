# Meridian — calm, professional SaaS look for all of Home Assistant
# Light: cool grey canvas, white cards with hairline borders, white header/sidebar,
#        one indigo accent (Quicken / Remote / Gusto style).
# Dark:  near-black blue-grey, cards one step lighter, hairlines, muted secondary text
#        (Vercel / Railway / Linear style).
#
# Install: copy to /config/themes/ (your configuration.yaml needs
#   frontend:
#     themes: !include_dir_merge_named themes
# ), then run the action "frontend.reload_themes" and pick the theme in your profile.

Meridian:
  # ── shared ──────────────────────────────────────────────────────────────────
  primary-font-family: "Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif"
  paper-font-common-base_-_font-family: "var(--primary-font-family)"
  mdc-typography-font-family: "var(--primary-font-family)"
  ha-font-family-body: "var(--primary-font-family)"
  ha-font-family-heading: "var(--primary-font-family)"
  ha-font-weight-heading: "650"
  ha-border-radius-md: "10px"
  ha-border-radius-lg: "12px"
  ha-border-radius-xl: "16px"

  ha-card-border-radius: "14px"
  ha-card-border-width: "1px"
  ha-dialog-border-radius: "16px"
  ha-badge-border-radius: "10px"
  ha-tile-border-radius: "12px"
  mdc-shape-small: "10px"
  mdc-shape-medium: "12px"

  header-height: "60px"

  # Mushroom cards (HACS) — calmer shapes and weights
  mush-icon-border-radius: "10px"
  mush-control-border-radius: "10px"
  mush-chip-border-radius: "10px"
  mush-badge-border-radius: "8px"
  mush-card-primary-font-weight: "600"
  mush-card-secondary-font-weight: "400"

  modes:
    # ── light ─────────────────────────────────────────────────────────────────
    light:
      primary-color: "#4F46E5"
      rgb-primary-color: "79, 70, 229"
      accent-color: "#4F46E5"
      rgb-accent-color: "79, 70, 229"
      dark-primary-color: "#4338CA"
      light-primary-color: "#EEF0FF"

      primary-background-color: "#F4F5F8"
      secondary-background-color: "#EEF0F4"
      lovelace-background: "#F4F5F8"
      card-background-color: "#FFFFFF"
      ha-card-background: "#FFFFFF"
      ha-card-border-color: "#E4E7EC"
      ha-card-box-shadow: "0 1px 2px rgba(16, 24, 40, 0.04)"
      divider-color: "#E4E7EC"
      outline-color: "#E4E7EC"

      primary-text-color: "#101828"
      rgb-primary-text-color: "16, 24, 40"
      secondary-text-color: "#667085"
      disabled-text-color: "#98A2B3"
      text-primary-color: "#FFFFFF"
      text-light-primary-color: "#101828"

      app-header-background-color: "#FFFFFF"
      app-header-text-color: "#101828"
      app-header-selection-bar-color: "#4F46E5"
      app-header-border-bottom: "1px solid #E4E7EC"

      sidebar-background-color: "#FFFFFF"
      sidebar-text-color: "#344054"
      sidebar-icon-color: "#667085"
      sidebar-selected-background-color: "#EEF0FF"
      sidebar-selected-text-color: "#4338CA"
      sidebar-selected-icon-color: "#4F46E5"
      sidebar-menu-button-text-color: "#101828"

      state-icon-color: "#667085"
      state-active-color: "#4F46E5"
      state-light-active-color: "#F59E0B"
      paper-item-icon-color: "#667085"
      paper-item-icon-active-color: "#4F46E5"

      input-fill-color: "#F9FAFB"
      mdc-text-field-fill-color: "#F9FAFB"
      input-ink-color: "#101828"
      input-label-ink-color: "#667085"
      input-idle-line-color: "#D0D5DD"
      input-hover-line-color: "#98A2B3"
      code-editor-background-color: "#F9FAFB"

      switch-checked-color: "#4F46E5"
      switch-checked-button-color: "#FFFFFF"
      switch-checked-track-color: "#4F46E5"
      switch-unchecked-button-color: "#FFFFFF"
      switch-unchecked-track-color: "#D0D5DD"
      slider-color: "#4F46E5"
      slider-track-color: "#E4E7EC"

      success-color: "#12B76A"
      warning-color: "#F79009"
      error-color: "#F04438"
      info-color: "#2E90FA"

      ha-dialog-surface-background: "#FFFFFF"
      mdc-theme-surface: "#FFFFFF"
      mdc-dialog-scrim-color: "rgba(16, 24, 40, 0.45)"
      table-row-background-color: "#FFFFFF"
      table-row-alternative-background-color: "#F9FAFB"
      markdown-code-background-color: "#F2F4F7"

      # HA 2025+ design tokens (tiles, buttons, badges, chips, inputs)
